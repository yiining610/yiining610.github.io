name: Deploy site

on:
  push:
    branches: [main]
    paths:
      - index.html
      - 404.html
      - assets/css/personal-site.css
      - .github/workflows/deploy.yml
  pull_request:
    branches: [main]
    paths:
      - index.html
      - 404.html
      - assets/css/personal-site.css
      - .github/workflows/deploy.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Prepare static site
        run: |
          mkdir -p _site/assets/css
          cp index.html 404.html _site/
          cp assets/css/personal-site.css _site/assets/css/
          touch _site/.nojekyll
      - name: Deploy to GitHub Pages
        if: github.event_name != 'pull_request'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: _site
          branch: gh-pages
